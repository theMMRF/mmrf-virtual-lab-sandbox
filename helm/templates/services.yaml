{{- range $name, $port := dict "frontend" 3000 "guppy" 8080 "analysis" 8000 "proteinpaint" 3000 "identity" 8080 "elasticsearch" 9200 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: {{ $name }}, app.kubernetes.io/instance: {{ $.Release.Name }}}
  ports: [{name: http, port: {{ $port }}, targetPort: {{ $port }}}]
{{- end }}
