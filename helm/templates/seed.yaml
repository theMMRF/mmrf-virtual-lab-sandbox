apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-seed
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: seed, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: seed, app.kubernetes.io/instance: {{ .Release.Name }}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: seed
          image: {{ .Values.images.seed | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [python, watch_seed.py]
          env:
            - {name: GEN3_ES_ENDPOINT, value: 'http://elasticsearch:9200'}
